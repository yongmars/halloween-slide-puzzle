<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ハロウィン・スライドパズル</title>
  <link rel="stylesheet" href="style.css?v=20261005-preview3">
</head>
<body>
  <main>
    <p class="eyebrow">🎃 HAPPY HALLOWEEN 🎃</p>
    <h1>スライドパズル</h1>
    <p>空いているマスのとなりをタップして<br>ハロウィンの絵を完成させよう！</p>
    <div class="toolbar"><label>難易度 <select id="size"><option value="3">やさしい（3×3）</option><option value="4">むずかしい（4×4）</option></select></label></div>
    <div class="records"><span>今回の手数 <strong id="moves">0</strong> 手</span><span>ベスト記録 <strong id="best">—</strong></span></div>
    <div id="board" aria-label="スライドパズル"></div>
    <button id="preview-toggle" type="button" aria-expanded="false" aria-controls="preview" disabled>ヒント：完成図を見る</button>
    <figure id="preview" hidden><img id="preview-image" alt="お手本の完成図"><figcaption>3秒だけ見られるよ。この絵を覚えてね！</figcaption></figure>
    <p id="status" role="status" aria-live="polite">画像を読み込んでいます…</p>
    <div class="actions"><button id="shuffle" disabled>シャッフル</button><button id="reset" disabled>リセット</button></div>
    <section id="clear" hidden><h2>🎉 Happy Halloween!</h2><p id="clear-message"></p><button id="again">もう一度あそぶ</button></section>
    <button id="retry" hidden>画像を再読み込み</button>
  </main>
  <script src="script.js?v=20261005-hint-button"></script>
</body>
</html>
